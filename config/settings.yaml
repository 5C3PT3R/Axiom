model: qwen2.5:7b
# LLM backend. Default: a model running locally in Ollama (no API key, no cost).
#   Dahl / any OpenAI-compatible API: model: deepseek-ai/DeepSeek-V4-Flash-0731,
#     provider: {base_url: "https://inference.dahl.global/v1", api_key_env: DAHL_API_KEY}
#   Fine-tuned local model (axiom train): provider: {type: local, adapter: models/axiom-lora,
#     base: Qwen/Qwen2.5-1.5B-Instruct}
#   Anthropic: remove `provider` and set a claude-* model.
provider: {base_url: "http://localhost:11434/v1"}
temperature: 0
seed: 42
detection:
  min_rel_change: 0.05
  baseline_weeks: 4
budgets: {investigation_tool_calls: 25, critic_tool_calls: 10, revise_loops: 2}
simulator: {days: 180, sessions_per_day: 10000}
simulator_extra:
  start_date: 2026-01-01
  sale_days: [2026-03-14, 2026-05-23, 2026-06-20]
  out_dir: data/sim
